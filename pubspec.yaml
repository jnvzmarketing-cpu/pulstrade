name: pulstrade
description: Pulstrade Gold Signal App
publish_to: 'release'
version: 1.1.0+27

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  timeago: ^3.7.0
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.3
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_core: ^4.7.0
  firebase_messaging: 16.2.0
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^6.2.2
  crypto: ^3.0.6
  purchases_flutter: ^10.4.3
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true 
  min_sdk_android: 21
  web:
    image_path: "assets/images/logo.png"
    background_color: "#0D0D0D"
    theme_color: "#FFD700"
  macos:
    image_path: "assets/images/logo.png"
